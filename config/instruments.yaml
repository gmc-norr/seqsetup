# Instrument Configuration
#
# This file defines supported sequencing instruments, their flowcells,
# SBS chemistry, and color balance settings.
#
# SBS Chemistry Groups (from Illumina documentation):
#
#   Four-color SBS:
#     Instruments: GAIIx, HiSeq 2000/2500, HiSeq 4000, HiSeq X, MiSeq (classic)
#     Channels: Blue, Green, Yellow, Red
#     Base colors: A=Green, C=Blue, T=Yellow, G=Red
#     No dark base. Highly tolerant of low-diversity libraries.
#
#   Two-color SBS (Red+Green):
#     Instruments: NextSeq 500/550, MiniSeq, NovaSeq 6000
#     Channels: Red, Green
#     Base colors: A=Red+Green (both), C=Red, T=Green, G=Dark
#     Channel 1 (Red):   A + C
#     Channel 2 (Green): A + T
#     Dark base: G. Sensitive to low-diversity and index imbalance.
#
#   Two-color SBS (Blue+Green, XLEAP):
#     Instruments: NovaSeq X/X Plus, MiSeq i100/i100 Plus, NextSeq 1000/2000
#     Channels: Blue, Green
#     Base colors: A=Blue, C=Blue+Green (both), T=Green, G=Dark
#     Channel 1 (Blue):  A + C
#     Channel 2 (Green): C + T
#     Dark base: G. Improved optics; reduced dark-base miscalls.
#
# i5 (Index 2): two facts per instrument (see Instruments in the admin guide)
#
#   i5_workflows: how the instrument reads the i5 in each way it runs, the
#     standard one first (a new run, or a run moved to this instrument, gets
#     it). forward: the i5 is read as the index kit lists it.
#     reverse-complement: it is read as its reverse complement.
#   runinfo_marks_i5_reversed: in a run whose i5 read is reversed, does the
#     instrument's RunInfo.xml mark it IsReverseComplement="Y"? Set false if
#     the control software does not write the tag, or if the BCL Convert that
#     reads the sheet does not act on it.
#
#   From these SeqSetup writes the Index2 column reversed when the run's
#   workflow reads the i5 reversed and RunInfo.xml does not mark it, and
#   forward otherwise. It writes the Index 2 part of OverrideCycles reversed
#   (I8N2 becomes N2I8) when the workflow reads the i5 reversed and
#   RunInfo.xml marks it.
#
#   Sources (Illumina):
#   https://knowledge.illumina.com/library-preparation/general/library-preparation-general-reference_material-list/000002099
#   https://knowledge.illumina.com/instrumentation/miseq-i100-series/instrumentation-miseq-i100-series-reference_material-list/000009499
#   https://help.dragen.illumina.com/dragen-v4.5/product-guides/dragen-v4.5/bcl-conversion
#   https://help.connected.illumina.com/run-set-up/overview/index-orientation-guide/i5-index-orientation-table
#   HiSeq: Indexed Sequencing Overview Guide (document 15057455), paired-end flow cells.
#
# Color balance is relevant for 2-color chemistry instruments where
# poor balance can affect base calling quality.
#
# For each 2-color instrument, channel1_bases and channel2_bases define
# which bases produce signal in each dye channel. The validation service
# uses these to compute per-position color balance.
#
# Reagent kit cycle limits (optional, per instrument):
#
#   reagent_kit_max_cycles:
#     300: <most cycles the 300-cycle kit allows, all reads together>
#
#   Read 1 + Index 1 + Index 2 + Read 2 above this number is a validation
#   error, and the run cannot be marked Ready. Take the number from the
#   kit's Illumina documentation; the kit label is not the limit (kits hold
#   extra cycles). If the limit differs between flowcells, enter the
#   smallest. A kit without a number is not checked. None are set here.

instruments:
  # NovaSeq X Series - Two-color XLEAP chemistry (Blue+Green)
  NovaSeq X Series:
    samplesheet_name: NovaSeqXSeries
    chemistry_type: 2-color
    has_dragen_onboard: true
    sbs_chemistry: "Two-color SBS (Blue+Green, XLEAP)"
    i5_workflows:
      - name: Standard
        i5_read_orientation: reverse-complement
    runinfo_marks_i5_reversed: true
    color_balance_enabled: true
    dye_channels: ["Blue", "Green"]
    base_colors:
      A: "Blue"
      C: "Blue+Green"
      T: "Green"
      G: "Dark"
    channel1_name: "Blue"
    channel1_bases: ["A", "C"]
    channel2_name: "Green"
    channel2_bases: ["C", "T"]
    dark_base: "G"
    error_tendencies: "Reduced dark-base miscalls; flatter error spectrum"
    onboard_applications:
      BCLConvert:
        software_version: "4.3.6"
      DragenGermline:
        software_version: "4.3.6"
      DragenSomatic:
        software_version: "4.3.6"
      DragenRNA:
        software_version: "4.3.6"
      DragenEnrichment:
        software_version: "4.3.6"
    flowcells:
      "1.5B":
        lanes: 2
        reads: 1500000000
        reagent_kits: [100, 200, 300]
        description: "1.5 billion reads, 2 lanes"
      "10B":
        lanes: 8
        reads: 10000000000
        reagent_kits: [100, 200, 300]
        description: "10 billion reads, 8 lanes"
      "25B":
        lanes: 8
        reads: 25000000000
        reagent_kits: [100, 200, 300]
        description: "25 billion reads, 8 lanes"

  # MiSeq i100 Series - Two-color XLEAP chemistry (Blue+Green)
