# Default cycle configurations per reagent kit
# These are typical defaults using (kit_label / 2) + 1 per read for paired-end.
# Kit cycle budgets include all reads (R1 + I1 + I2 + R2), but kits contain
# extra cycles beyond the label (~38 extra for XLEAP, ~29 for classic MiSeq).
# Users can customize per run.
default_cycles:
  36:
    read1: 18
    read2: 18
    index1: 8
    index2: 8
  50:
    read1: 26
    read2: 26
    index1: 8
    index2: 8
  75:
    read1: 36
    read2: 36
    index1: 8
    index2: 8
  76:
    read1: 38
    read2: 38
    index1: 8
    index2: 8
  100:
    read1: 51
    read2: 51
    index1: 10
    index2: 10
  125:
    read1: 63
    read2: 63
    index1: 8
    index2: 8
  150:
    read1: 76
    read2: 76
    index1: 10
    index2: 10
  200:
    read1: 101
    read2: 101
    index1: 10
    index2: 10
  250:
    read1: 126
    read2: 126
    index1: 10
    index2: 10
  300:
    read1: 151
    read2: 151
    index1: 10
    index2: 10
  500:
    read1: 251
    read2: 251
    index1: 10
    index2: 10
  600:
    read1: 301
    read2: 301
    index1: 10
    index2: 10
  1000:
    read1: 501
    read2: 501
    index1: 10
    index2: 10

# Common index cycle options
index_cycle_options: [8, 10, 12, 17, 24]
