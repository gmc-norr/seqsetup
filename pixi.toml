[workspace]
authors = ["Pär Larsson <par.larsson@umu.se>"]
channels = ["conda-forge"]
name = "seqsetup"
platforms = ["linux-64"]
version = "0.2.0"
# Lock only releases at least two weeks old, so a broken new release has time
# to be found and pulled before it reaches the lab. Move the date forward when
# updating the lock (`pixi update`); tests/unit/test_dependency_floors.py holds
# 13 named packages at a hand-written floor and looks nothing up, so it is not
# a scanner -- an advisory nobody has added a floor for passes it, and the
# other 149 packages in the lock are not looked at. Check the locked versions
# by hand after an update, as docs/development/contributing.rst ("Updating
# Libraries") says.
# A security release may justify a later date: 2026-10-04 lets in OpenSSL 3.6.5
# (conda-forge, 2026-10-04), which fixes 12 advisories in 3.6.4.
exclude-newer = "2026-10-04"

[tasks]
serve = { cmd = "PYTHONPATH=src python -m seqsetup.app", depends-on = ["css"] }
mock-api = "uvicorn tools.mock_igene_api:app --port 8100"
create-admin = "PYTHONPATH=src python -m seqsetup.create_admin"
use-local-sign-in = "PYTHONPATH=src python -m seqsetup.use_local_sign_in"
tailwind-install = "bash tools/install-tailwind.sh"
css = { cmd = "bash -c '.pixi/bin/tailwindcss -i src/seqsetup/static/css/input.css -o src/seqsetup/static/css/app.css --minify'", depends-on = ["tailwind-install"] }
css-watch = { cmd = "bash -c '.pixi/bin/tailwindcss -i src/seqsetup/static/css/input.css -o src/seqsetup/static/css/app.css --watch'", depends-on = ["tailwind-install"] }

[dependencies]
python = ">=3.14"
openssl = ">=3.6.5"
pyyaml = ">=6.0"
matplotlib-base = ">=3.10.8,<4"  # not `matplotlib`, which adds the Qt desktop toolkit
numpy = ">=2.5.3"  # imported directly (services/validation_report.py), not only via matplotlib
reportlab = ">=5.0.1,<6"
pillow = ">=12.3.0"

[pypi-dependencies]
python-multipart = ">=0.0.31"
bcrypt = ">=4.0"
pymongo = ">=4.18.2"
ldap3 = ">=2.9"
packaging = ">=24.0"
fastapi = ">=0.115"
starlette = ">=1.3.1,<2"
uvicorn = ">=0.34"
jinja2-fragments = ">=1.4,<2"
pydantic = ">=2.7,<3"
itsdangerous = ">=2.2.0, <3"

# The test, browser and docs tools, and the tasks that need them. They are kept
# out of the default environment so the Docker image (`pixi install --locked
# --environment default`) ships none of them: in the lab they would be code
# with its own security fixes to follow and nothing the app calls.
# `pixi run test`, `pixi run docs`, `pixi run smoke-browser` and the other dev
# tasks resolve to this environment on their own.
[feature.dev.dependencies]
pytest = ">=9.0.3"

[feature.dev.pypi-dependencies]
sphinx = ">=7.0"
furo = ">=2024.1"
mongomock = ">=4.3.0, <5"
pytest-playwright = ">=0.5,<1"
httpx2 = ">=2.13.1,<3"

[feature.dev.tasks]
test = "PYTHONPATH=src pytest tests/unit tests/integration"
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"
playwright-install = "playwright install chromium"
smoke-browser = { cmd = "PYTHONPATH=src pytest tests/browser -v", depends-on = ["css"] }
docs-screenshots = { cmd = "SEQSETUP_DOCS_SCREENSHOTS=1 PYTHONPATH=src pytest tests/browser/test_docs_screenshots.py -q", depends-on = ["css"] }

# One solve group: both environments are solved together, so a package in both
# is the same version and build in both.
[environments]
default = { solve-group = "seqsetup" }
dev = { features = ["dev"], solve-group = "seqsetup" }
