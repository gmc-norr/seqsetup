# Pytest settings. There was no ini file: pytest ran on its defaults, so a
# test that hung hung until something outside killed it, and the log said
# nothing about where (2026-10-18 batch, step 9).
[pytest]
# Dump the tracebacks of every thread when one test has run this long. It
# does not fail or kill the test -- pytest has no built-in way to do that --
# but it turns "the suite stopped" into "the suite stopped HERE", which is
# what a hang costs most. A per-test time limit that actually ends the test
# needs pytest-timeout, which this environment does not have and which this
# change may not add (recorded as an open item).
#
# 300 seconds is above anything legitimate: the slowest single thing in this
# suite is a Mark Ready that draws the validation report's charts, which the
# project documents as taking up to two minutes for a large run, and the
# whole browser suite runs in about 110 seconds across eight parts.
faulthandler_timeout = 300
