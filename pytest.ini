# Pytest settings. There was no ini file: pytest ran on its defaults, so a
# test that hung hung until something outside killed it, and the log said
# nothing about where (2026-10-18 batch, step 9).
[pytest]
# Dump the tracebacks of every thread when one test has run this long. It
# neither fails nor ends the test -- tests/conftest.py's
# pytest_runtest_protocol hook does that, with no dependency -- but it is the
# only one of the two that reports threads OTHER than the main one, where an
# alarm cannot reach. Keep both. Neither covers a hang during collection.
#
# 300 seconds is far above anything legitimate: the slowest single test
# measured is about 50 s (tests/integration/test_index_safety_net.py), and the
# whole browser suite runs in about 110 s across eight parts. A false fire
# only prints a traceback.
faulthandler_timeout = 300
