{% extends "_base.html" %}
{% block title %}SeqSetup - Login{% endblock %}
{% block body %}
<main class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>SeqSetup</h1>
            <p class="login-subtitle">Illumina Sequencing Run Configuration</p>
        </div>
        <form action="/login/submit" method="post" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username"
                       required autofocus placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password"
                       required placeholder="Enter your password">
            </div>
            {% if error_message %}
            <div class="error-message">{{ error_message }}</div>
            {% endif %}
            <button type="submit" class="btn-primary btn-login">Sign In</button>
        </form>
    </div>
</main>
{% endblock %}
