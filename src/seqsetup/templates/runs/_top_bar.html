{# TopBarForRun — two-column layout with Validate + Export panels. #}
<div class="run-config-horizontal">
    <div class="top-bar-columns">
        <div class="config-column">
            {% with run=run, validation_result=validation_result %}
            {% include "runs/_validate_panel.html" %}
            {% endwith %}
        </div>
        <div class="config-column">
            {% with run=run, has_v1=has_v1, oob=False %}
            {% include "runs/_export_panel.html" %}
            {% endwith %}
        </div>
    </div>
</div>
