{#
   Reagent-kit <select>. Inputs:
     run_id:       str
     current:      int       — currently-selected reagent_cycles value
     reagent_kits: list[int] — available cycle counts
     cycle_total_oob: bool   — also send the cycle total line out of band
                   (needs run, cycles, kit_max_cycles; see _cycle_total.html)
#}
<select name="reagent_cycles" id="reagent-kit-select"
        hx-post="/runs/{{ run_id }}/reagent-kit"
        hx-target="#cycle-config"
        hx-swap="outerHTML">
    {% for kit in reagent_kits %}
    <option value="{{ kit }}" {% if current == kit %}selected{% endif %}>{{ kit }} cycles</option>
    {% endfor %}
</select>
{% if cycle_total_oob %}{% with oob=True %}{% include "wizard/_cycle_total.html" %}{% endwith %}{% endif %}
