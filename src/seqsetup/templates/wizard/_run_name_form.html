{#
   Run name + description form. HTMX-saves on change (hx-trigger=change).
   "submit" is caught too: Enter in the name box would otherwise submit
   the form natively, reloading the page without its run_id.
   Inputs: run
#}
<form hx-post="/runs/{{ run.id }}/name"
      hx-trigger="change, submit"
      hx-swap="none"
      class="run-name-form">
    <div class="form-group">
        <label for="run_name">Run Name</label>
        <input type="text" name="run_name" id="run_name"
               value="{{ run.run_name }}"
               placeholder="e.g., Run_20240115">
    </div>
    <div class="form-group">
        <label for="run_description">Description</label>
        <textarea name="run_description" id="run_description"
                  placeholder="Optional run description"
                  rows="2">{{ run.run_description }}</textarea>
    </div>
</form>
