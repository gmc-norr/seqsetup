{#
   Test-id dropdown for bulk-action panel.
   Inputs:
     test_profiles: list[OfferedTest] | None — one per test
#}
{% if not test_profiles %}
<select id="bulk-test-id-input" class="test-id-input bulk-test-id-input" aria-label="Test ID" disabled>
    <option value="" disabled selected>No test profiles available</option>
</select>
{% else %}
<select id="bulk-test-id-input" class="test-id-input bulk-test-id-input" aria-label="Test ID">
    <option value="" selected>Select a test...</option>
    {% for tp in test_profiles %}
        <option value="{{ tp.test_name }}">{{ tp.test_name }}{% if tp.test_type and tp.test_type != tp.test_name %} ({{ tp.test_type }}){% endif %}</option>
    {% endfor %}
</select>
{% endif %}
